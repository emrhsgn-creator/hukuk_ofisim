name: sb_legal
description: "SB Legal — Avukat-Müvekkil İletişim Platformu"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase Araçları
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.5.1

  # Dosya ve Veri Araçları
  file_picker: 8.1.2
  csv: ^6.0.0
  uuid: ^4.5.3
  file_saver: ^0.2.10

  # Tasarım ve İkonlar
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Ağ (EmailJS ile mail bildirimi)
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true